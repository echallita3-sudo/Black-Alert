name: Android readiness
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source and manifests
        run: python3 tools/check_source.py
      - name: Report Unity activation readiness
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "UNITY LICENSE FILE: configured"
          elif [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "UNITY PROFESSIONAL SERIAL: configured"
          else
            echo "::warning::Unity licensing not configured; Android cloud compilation cannot start."
          fi
          echo "This workflow does not compile Unity or generate an APK."
